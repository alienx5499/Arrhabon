[workspace]
members = ["crates/*", "programs/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"

[workspace.dependencies]
arrhabon-domain = { path = "crates/domain" }
arrhabon-app = { path = "crates/app" }
arrhabon-solana-adapter = { path = "crates/solana_adapter" }
arrhabon-aurora-adapter = { path = "crates/aurora_adapter" }
anchor-lang = "1.2.1"
anchor-client = { version = "1.2.1", features = ["async"] }
arrhabon = { path = "programs/arrhabon", features = ["no-entrypoint"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
bincode = "1.3.3"
anchor-spl = "1.2.1"
litesvm = "0.18.1"
solana-account = "4.3.0"
solana-address = "~2.7.0"
solana-clock = "~3.2.0"
solana-instruction = "~3.5.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
proptest = "1.12.0"
thiserror = "2.0.21"
bs58 = "0.5.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wiremock = "0.6.5"
axum = { version = "0.8.9", features = ["macros"] }
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.22.1"
http-body-util = "0.1.5"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
